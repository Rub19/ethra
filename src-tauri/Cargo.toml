[package]
name = "ethra"
version = "0.2.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
