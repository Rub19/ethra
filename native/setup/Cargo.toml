[package]
name = "kairo-setup"
version = "2.0.0"
edition = "2021"

[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "image-default-formats", "unstable-winit-030"] }
flate2 = "1"
winreg = "0.55"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
